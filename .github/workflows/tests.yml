name: Fresh Worker regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "httpx>=0.27,<1" "pydantic>=2,<3"
      - run: python -m compileall -q open-webui tests
      - run: python -m unittest discover -s tests -v
